<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S.T.A.S.I.S. // SUBZERO_COMMAND_DECK</title>
    <style>
        @font-face { font-family: 'data'; src: url('data.ttf'); }
        :root {
            --bg-obsidian: #050608;
            --panel-inner: #111111;
            --ice-cyan: #ffffff;
            --whiteout: #a3a3a3;
            --border-inset: #050505;
            --border-outset: #2d2d2d;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-obsidian);
            font-family: 'data', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-image: radial-gradient(#2d2d2d 1px, transparent 0);
            background-size: 6px 6px;
        }
        #menu-trigger {
            position: fixed;
            top: 10px;
            left: 0;
            transform: translateX(-22px);
            z-index: 10000;
            width: 32px;
            height: 32px;
            background: #181818;
            border: 1px solid #000;
            border-top: 1px solid #3c3c3c;
            border-left: none;
            color: var(--whiteout);
            font-size: 16px;
            line-height: 30px;
            text-align: right;
            padding-right: 6px;
            box-sizing: border-box;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            user-select: none;
        }
        #menu-trigger:hover {
            transform: translateX(0);
            background: #222;
            color: #fff;
            text-align: center;
            padding-right: 0;
        }
        #menu-trigger.open-active {
            transform: translateX(170px);
            text-align: center;
            padding-right: 0;
            background: #121212;
            border-top: 1px solid #000;
        }
        #side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 170px;
            background-color: var(--panel-inner);
            border-right: 2px solid var(--border-inset);
            border-top: 2px solid var(--border-outset);
            z-index: 9999;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding-top: 50px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.9);
        }
        #side-drawer.open {
            transform: translateX(0);
        }
        .unit-btn {
            background: #181818;
            color: var(--whiteout);
            border: 1px solid #000;
            border-top: 1px solid #3c3c3c;
            border-left: 1px solid #2a2a2a;
            padding: 12px 15px;
            font-family: 'data', monospace;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: left;
            position: relative;
            transition: all 0.05s;
            width: 100%;
            letter-spacing: 1px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.7), inset 0 0 4px rgba(0,0,0,0.4);
            margin-bottom: 6px;
            box-sizing: border-box;
        }
        .unit-btn:hover {
            color: #fff;
            background: #222;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }
        .unit-btn:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.9);
            color: #fff;
            background-color: #121212;
        }
        .unit-btn.active {
            color: #fff;
            background: #121212;
            border-left: 3px solid #fff;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.9);
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .unit-btn.active::after {
            content: 'ACTIVE';
            position: absolute;
            right: 8px;
            top: 14px;
            font-size: 7px;
            color: #fff;
            opacity: 0.8;
            letter-spacing: 0px;
        }
        .unit-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 1;
            background: var(--bg-obsidian);
        }
        .unit-frame.active-view {
            opacity: 1;
            pointer-events: all;
            z-index: 5;
        }
        #click-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #click-shield.active {
            opacity: 1;
            pointer-events: all;
        }
        .drawer-header {
            padding: 0 15px 15px 15px;
            opacity: 0.5;
            font-size: 9px;
            color: var(--whiteout);
            letter-spacing: 2px;
            border-bottom: 1px solid #000;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="menu-trigger" onclick="toggleMenu()">+</div>
    <div id="click-shield" onclick="toggleMenu()"></div>
    <div id="side-drawer">
        <div class="drawer-header">S.T.A.S.I.S. // CORE</div>
        <button class="unit-btn active" onclick="switchUnit(1)">
            UNIT_01
            <br><span style="font-size:9px; opacity:0.6">BAPSTEP_8</span>
        </button>
        <button class="unit-btn" onclick="switchUnit(2)">
            UNIT_02
            <br><span style="font-size:9px; opacity:0.6">SAMPLER</span>
        </button>
        <button class="unit-btn" onclick="switchUnit(3)">
            UNIT_03
            <br><span style="font-size:9px; opacity:0.6">LAZERBLADE_3</span>
        </button>
        <button class="unit-btn" onclick="switchUnit(4)">
            UNIT_04
            <br><span style="font-size:9px; opacity:0.6">PITCH_SHIFT</span>
        </button>
        <button class="unit-btn" onclick="switchUnit(5)">
            COOL_TOOLS
            <br><span style="font-size:9px; opacity:0.6">PRO_2</span>
        </button>
    </div>
    
    <iframe id="u1" class="unit-frame active-view" src="https://alphaslider.github.io/BapStep8/" allow="clipboard-read; clipboard-write; microphone; midi"></iframe>
    <iframe id="u2" class="unit-frame" src="https://alphaslider.github.io/HTML5SAMPLER/" allow="clipboard-read; clipboard-write; microphone; midi"></iframe>
    <iframe id="u3" class="unit-frame" src="https://alphaslider.github.io/LazerBlade3/" allow="clipboard-read; clipboard-write; microphone; midi"></iframe>
    <iframe id="u4" class="unit-frame" src="https://alphaslider.github.io/SP224-Pitch-shifter/" allow="clipboard-read; clipboard-write; microphone; midi"></iframe>
    <iframe id="u5" class="unit-frame" src="https://alphaslider.github.io/cooltoolspro2/" allow="clipboard-read; clipboard-write; microphone; midi"></iframe>

    <script>
        const drawer = document.getElementById('side-drawer');
        const shield = document.getElementById('click-shield');
        const trigger = document.getElementById('menu-trigger');

        function toggleMenu() {
            drawer.classList.toggle('open');
            shield.classList.toggle('active');
            trigger.classList.toggle('open-active');
                        
            if(drawer.classList.contains('open')) {
                trigger.innerHTML = '×';
                trigger.style.color = '#fff';
                trigger.style.background = '#121212';
            } else {
                trigger.innerHTML = '+';
                trigger.style.color = 'var(--whiteout)';
                trigger.style.background = '#181818';
            }
        }

        function switchUnit(id) {
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.unit-btn:nth-of-type(${id})`).classList.add('active');
                        
            document.querySelectorAll('.unit-frame').forEach(f => f.classList.remove('active-view'));
            document.getElementById(`u${id}`).classList.add('active-view');

            setTimeout(toggleMenu, 200);
        }
    </script>
</body>
</html>
